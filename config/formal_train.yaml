# Formal training config for long-running experiments.

data:
  dataset_path: "/mnt/d/brats2023"
  modalities:
    - T1
    - T2
  slice_axis: 2
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  num_workers: 4
  dataloader_workers_with_slice_cache: false
  preload_volumes: true
  max_patients: null
  max_slices_per_patient: 16

task1:
  acceleration_factor: 5
  sigma: 0.3
  num_slices_to_show: 4

task2:
  model: "unet"
  in_channels: 1
  out_channels: 1
  base_channels: 24
  depth: 6
  batch_size: 8
  num_epochs: 150
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 5
    min_lr: 0.000001
  early_stop_patience: 15

task3:
  model: "unrolled_unet"
  in_channels: 2
  out_channels: 1
  base_channels: 16
  depth: 6
  num_cascades: 5
  dc_weight: 0.1
  loss_type: "hybrid"
  l1_weight: 0.5
  batch_size: 8
  num_epochs: 150
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 5
    min_lr: 0.000001
  early_stop_patience: 15

output:
  dir: "./outputs_formal"
  save_model: true
  log_interval: 50

runtime:
  use_amp: true
  resume: true
