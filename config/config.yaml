# BraTS MRI Reconstruction Configuration
# ==========================================

data:
  dataset_path: "Home/Downloads/dataset"   # Path on cloud desktop
  modalities:
    - T1
    - T2
  slice_axis: 2           # Axial slices (0=sagittal, 1=coronal, 2=axial)
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

task1:
  acceleration_factor: 5
  sigma: 0.3              # Variable density parameter (higher = denser center)
  num_slices_to_show: 4   # Number of example slices to visualize

task2:
  model: "unet"
  in_channels: 1
  out_channels: 1
  base_channels: 32
  depth: 4
  batch_size: 16
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 10
    min_lr: 0.000001

task3:
  model: "unrolled_unet"
  in_channels: 2           # Undersampled T2 + Fully sampled T1
  out_channels: 1
  base_channels: 32
  depth: 4
  num_cascades: 5          # Number of unrolled iterations
  dc_weight: 0.1           # λ in DC layer
  loss_type: "hybrid"      # "l1", "l2", or "hybrid"
  l1_weight: 0.5           # Weight for L1 in hybrid loss
  batch_size: 8
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_scheduler:
    type: "ReduceLROnPlateau"
    factor: 0.5
    patience: 15
    min_lr: 0.000001

output:
  dir: "./outputs"
  save_model: true
  log_interval: 50         # Log every N batches
